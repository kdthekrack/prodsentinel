# Industry pack: GoldenCrust Foods Pvt. Ltd. (fictional biscuit plant).
# Second pack to show the engine is industry-agnostic: parallel stations, food materials, different roles.
pack_id: biscuit_bakery
company:
  name: GoldenCrust Foods Pvt. Ltd.
  industry: Biscuit baking and packaging
  site: Plant 2
currency:
  code: INR
  symbol: ₹
calendar:
  start: 2015-01-01 06:00
  end: 2016-01-01 06:00
  train_end: 2015-08-31 23:59
  validation_end: 2015-09-30 23:59
  shifts:
    Morning: 6
    Evening: 14
    Night: 22
  shift_hours: 8
data_sources:
  machine_health:
    provider: azure_pdm
    path: data/raw
    machine_mapping: sequential
  plant:
    provider: synthetic
sensors:
  volt:
    label: Motor supply voltage
    unit: V
  rotate:
    label: Drive speed
    unit: rpm
  pressure:
    label: Pneumatic pressure
    unit: psi
  vibration:
    label: Vibration
    unit: mm/s
error_codes:
  error1: Drive overcurrent trip
  error2: Motor over-temperature
  error3: Air pressure fluctuation
  error4: High vibration alarm
  error5: Position sensor fault
components:
  comp1:
    name: drive motor
    repair_hours:
    - 3
    - 8
    repair_cost: 45000
    symptoms:
    - motor drawing high current
    - motor running hot
    - intermittent stalls on start-up
    - burning smell near drive
    actions:
    - replaced drive motor
    - rewound motor and replaced contactor
    - replaced VFD fan and motor bearings
  comp2:
    name: bearing or gearbox
    repair_hours:
    - 2
    - 6
    repair_cost: 18000
    symptoms:
    - grinding noise from gearbox
    - bearing housing hot to touch
    - vibration rising over last shifts
    - oil seepage at gearbox
    actions:
    - replaced bearings and re-greased
    - replaced gearbox
    - realigned coupling and replaced bearing
  comp3:
    name: pneumatic valve
    repair_hours:
    - 1
    - 4
    repair_cost: 9000
    symptoms:
    - air leak at valve block
    - slow actuator response
    - pressure dropping under load
    - sticking solenoid
    actions:
    - replaced valve block
    - replaced solenoid and seals
    - cleaned and rebuilt valve manifold
  comp4:
    name: pump or seal
    repair_hours:
    - 2
    - 7
    repair_cost: 26000
    symptoms:
    - product leak at pump seal
    - pump cavitation noise
    - flow rate unstable
    - seal weeping
    actions:
    - replaced mechanical seal
    - replaced pump impeller and seals
    - rebuilt pump
planned_maintenance:
  duration_h: 2
  during_changeover: true
line_templates:
  biscuit_line:
    stations:
    - name: Dough mixer
      code: MIX
      count: 2
      mode: parallel
      required: 1
    - name: Sheeter
      code: SHT
      count: 1
      mode: series
    - name: Rotary moulder
      code: MLD
      count: 2
      mode: parallel
      required: 2
    - name: Tunnel oven
      code: OVN
      count: 1
      mode: series
    - name: Cooling conveyor
      code: COL
      count: 2
      mode: series
    - name: Packing machine
      code: PCK
      count: 4
      mode: parallel
      required: 3
      quality_metric: pack_weight_g
      critical_role: packing_operator
    - name: Sealer
      code: SEL
      count: 2
      mode: parallel
      required: 2
      quality_metric: seal_strength_n
    - name: Checkweigher
      code: CHK
      count: 1
      mode: series
    - name: Cartoner
      code: CRT
      count: 1
      mode: series
lines:
