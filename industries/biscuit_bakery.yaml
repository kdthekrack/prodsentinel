owners:
  machine: maintenance_lead
  material: purchasing
  workforce: line_supervisor
  quality: quality_lead
  orders: line_supervisor
  demand: plant_manager
  compound: plant_manager
escalation:
  approver_role: plant_manager         # only this role can authorize & dispatch a plan
  severity_bands:
    critical: 250000
    high: 75000
    medium: 25000
  ack_timeout_min:
    critical: 15
    high: 30
    medium: 120
    low: 480
  notify_plant_manager_on:
  - critical
  channels:
  - outbox
  auto_resolve_after_h: 12
  keep_open_ratio: 0.5
  max_reminders: 3
playbook:
  machine:
  - action: Replace the {component} on {machine_name} during the next planned stop, before it breaks down
    owner: maintenance_lead
  - action: Keep a spare {component} and a technician ready at the {station}
    owner: maintenance_lead
  - action: If it cannot be fixed in time, move urgent orders from {line_name} to another line
    owner: plant_manager
  material:
  - action: Call {supplier} to speed up the {material} delivery, or buy from an approved backup supplier
    owner: purchasing
  - action: Change the {line_name} run plan to products that do not need {material} until stock arrives
    owner: line_supervisor
  workforce:
  - action: Call in a trained backup {role} for the {shift} shift on {line_name}
    owner: line_supervisor
  - action: Approve overtime so a trained {role} can cover the {shift} shift
    owner: plant_manager
  quality:
  - action: Stop and adjust the {station} on {line_name}, then re-check {metric}
    owner: quality_lead
  - action: Check packs from {line_name} every 30 minutes until {metric} is back within limits
    owner: line_supervisor
  orders:
  - action: Run order {order} for {customer} first, ahead of lower-priority orders
    owner: line_supervisor
  - action: Tell {customer} early and agree a new delivery date to reduce the penalty
    owner: plant_manager
  demand:
  - action: Add extra shifts or move part of the demand for {line_name} to another line
    owner: plant_manager

